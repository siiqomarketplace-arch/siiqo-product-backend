client_max_body_size 50M;
proxy_read_timeout 300s;
proxy_connect_timeout 75s;
proxy_send_timeout 300s;

# Disable request buffering for multipart uploads (logo, banner, product images).
# Without this, nginx buffers large request bodies to a temp file and strips
# the multipart Content-Type boundary before passing to gunicorn, causing 415.
proxy_request_buffering off;
client_body_buffer_size 50M;

# Ensure all headers including Content-Type are passed to gunicorn unchanged.
proxy_pass_request_headers on;

# Convert chunked transfer encoding to a fixed Content-Length so Werkzeug
# (Flask 3 / Werkzeug 3.x) can correctly parse multipart/form-data on PATCH.
proxy_http_version 1.1;
chunked_transfer_encoding off;
