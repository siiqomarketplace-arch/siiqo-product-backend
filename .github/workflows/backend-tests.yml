name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app

      - name: Undefined-name check
        run: |
          if python -m pyflakes app | grep -E "undefined name|referenced before assignment"; then
            echo "Undefined names found"; exit 1
          fi

      - name: Tests
        run: python -m pytest
